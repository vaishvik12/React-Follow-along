<!DOCTYPE html>
<html>

<head>
  <title>React Basics</title>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">

    function ProductDetails({name,price,discountPrice,image}) {
    //  const name = props.name;
    //  const price = props.price;
    // const {name,price} = props; //destructuring
    console.log(image);
      return (
        <div>
          <img src = {image} width = "100px"/>
          <p>{name}</p>
          {discountPrice 
          ? <del><p>Price: ${price}</p></del>
          : <p>Price: ${price}</p>}
          {discountPrice && <p>Discount price : ${discountPrice}</p>}
          <button>Add to cart</button>
        </div>
      )
    }

    function App() {
      return (
        <>
          <ProductDetails
            name="Cotton socks"
            price="10.90" 
            discountPrice = "5.45"
            image = "cotton-socks.png"/>
          <ProductDetails
            name="Tennis ball"
            price="7.99" 
            image = "tennis-balls.png"/>
          <ProductDetails
            name="T-Shirt"
            price="7.99" 
            image = "plain-t-shirt.png"/>
        </>
      )
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);

  </script>
</body>

</html>
