<!DOCTYPE html>
<html>

<head>
  <title>React Basics</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin : 0px;
    }

    .send-bttn {
      background-color: rgb(25, 135, 84);
      padding: 8px 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      color: white;
      margin-left: 10px;
    }

    .chat-input {
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 16px;
      flex-grow: 1
    }

    .chat-input-div {
      display: flex;
      margin-bottom : 20px;
    }

    .app-container {
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      height : 100vh;
      display : flex;
      flex-direction : column;
    }

    .user-message-div {
      display: flex;
      justify-content: end;
      align-items: start;
      margin-top: 10px
    }

    .robot-message-div {
      display: flex;
      justify-content: start;
      align-items: start;
      margin-top: 10px;
    }

    .chat-message-div {
      background-color: rgb(230, 230, 230);
      padding: 12px 20px;
      margin-left: 10px;
      margin-right: 10px;
      margin-top: 10px;
      margin-bottom : 10px;
      max-width: 300px;
      border-radius: 8px
    }
    .chat-messages-div{
      flex-grow : 1;
      overflow:  scroll;
      scrollbar-width: none;
    }
  </style>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">

    function ChatInput({ chatMessages, setChatMessages }) {
      const [inputValue, setInputValue] = React.useState("");
      function storeInputValue(event) {
        setInputValue(event.target.value);//he
      }

      async function sendNewMessage() {

        const userMessage = [...chatMessages, {
          message: inputValue,
          sender: "user",
          id: crypto.randomUUID()
        }];

        setChatMessages(userMessage)

        let chatBotResponse = await Chatbot.getResponseAsync(inputValue);

        setChatMessages([...userMessage, {
          message: chatBotResponse,
          sender: "robot",
          id: crypto.randomUUID()
        }])


        setInputValue("");
      }

      function handleKeyDown(event) {
        if (event.key === "Enter") {
          sendNewMessage()
        } else if (event.key === "Escape") {
          setInputValue("");
        }
      }



      return (
        <div
          className="chat-input-div">
          <input type="text"
            placeholder="Send a message to the chat bot"
            size="30"
            onChange={storeInputValue}
            onKeyDown={handleKeyDown}
            value={inputValue}
            className="chat-input"
          />

          <button
            className="send-bttn"
            onClick={sendNewMessage}
          >
            Send
          </button>
        </div>
      )
    };


    function ChatMessage({ message, sender }) {
      return (
        <div className={sender === "user"
          ? "user-message-div"
          : "robot-message-div"
        }>
          {sender === "robot" &&
            <img
              src="robot.png"
              width="50" />}

          <div className="chat-message-div">
            {message}
          </div>

          {sender === "user" &&
            <img
              src="user.png"
              width="50" />}
        </div>
      )
    }

    function ChatMessages({ chatMessages, setChatMessages }) {


      return (
        <div className = "chat-messages-div">
          {chatMessages.map(chatMessage => {
            return (<ChatMessage
              message={chatMessage.message}
              sender={chatMessage.sender}
              key={chatMessage.id}
            />)
          })}
        </div>
      )
    }

    function App() {
      const [chatMessages, setChatMessages] = React.useState([{
        message: "hello",
        sender: "user",
        id: "id1"
      }, {
        message: "Hello! How can I help you?",
        sender: "robot",
        id: "id2"
      }, {
        message: "Flip a coin",
        sender: "user",
        id: "id3"
      }, {
        message: "Sure! You got heads",
        sender: "robot",
        id: "id4"
      }, {
        message: "Thank you",
        sender: "user",
        id: "id5"
      }, {
        message: "No problem! Let me know if you need help with anything else!",
        sender: "robot",
        id: "id6"
      }]);


      return (
        <div className="app-container">

          <ChatMessages
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
          />
          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
          />
        </div>)
    };

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);

  </script>
</body>

</html>
